name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and validate release artifacts
        run: npm run release:check

      - name: Upload plugin release files
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated build artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugin-release
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css --generate-notes --verify-tag
